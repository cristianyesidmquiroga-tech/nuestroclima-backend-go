services:
  db:
    image: postgres:18-alpine
    container_name: nuestroclima_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-nuestroclima}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migraciones:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-nuestroclima}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nuestroclima_api
    restart: unless-stopped
    environment:
      APP_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-nuestroclima}
      STATION_PASSKEY: ${STATION_PASSKEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
